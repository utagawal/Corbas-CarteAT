services:
  carteat:
    build: .
    image: carteat-corbas:latest
    container_name: carteat-corbas
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8080}
    # Par défaut exposé uniquement en local : un reverse proxy (nginx, Apache, Caddy…) assure le HTTPS.
    # HOST_BIND=0.0.0.0 pour un proxy situé sur une autre machine (pare-feu à prévoir).
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8085}:${PORT:-8080}"
    volumes:
      - carteat-data:/data
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  carteat-data:
