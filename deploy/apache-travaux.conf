# Carte des arrêtés travaux — publication sous https://corbas.fr/travaux/ avec Apache 2.4.
#
# À placer dans le <VirtualHost *:443> de corbas.fr (pas dans .htaccess : ProxyPass n'y est pas
# autorisé). Les requêtes /travaux/ sont transmises avant les règles de réécriture de WordPress.
# Modules : sudo a2enmod proxy proxy_http headers ssl && sudo apachectl configtest && sudo systemctl reload apache2
#
# Choisir UNE des deux variantes A ou B, et décommenter ses lignes.

RedirectMatch 301 ^/travaux$ /travaux/

# --- Variante A : le conteneur tourne sur ce même serveur (HOST_PORT=8085) ----------------------
# ProxyPass        /travaux/ http://127.0.0.1:8085/
# ProxyPassReverse /travaux/ http://127.0.0.1:8085/
# ProxyPassReverseCookiePath / /travaux/

# --- Variante B : relais vers l'instance existante https://maps.utagawavtt.com/ATCorbas/ -------
# SSLProxyEngine on
# SSLProxyCheckPeerName on
# ProxyPass        /travaux/ https://maps.utagawavtt.com/ATCorbas/
# ProxyPassReverse /travaux/ https://maps.utagawavtt.com/ATCorbas/
# ProxyPassReverseCookiePath /ATCorbas/ /travaux/

<Location /travaux/>
    RequestHeader set X-Forwarded-Proto "https"
    # Ne pas imposer « X-Frame-Options » ici : l'application gère l'intégration (CSP frame-ancestors).
    Header unset X-Frame-Options
    Header always unset X-Frame-Options
</Location>
