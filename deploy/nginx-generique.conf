# Carte des arrêtés travaux — configuration nginx générique (à adapter).
#
# L'application fonctionne aussi bien à la racine d'un domaine (https://travaux.exemple.fr/) que sous
# un chemin quelconque (https://www.exemple.fr/travaux/) : toutes ses URL sont relatives.
# À inclure dans le bloc « server { listen 443 ssl; … } » du site :
#     include /etc/nginx/snippets/carteat.conf;
# puis : sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer « /travaux/ » par le chemin voulu (garder les « / ») et 8085 par HOST_PORT.
# À la racine d'un domaine : « location / { proxy_pass http://127.0.0.1:8085; … } » sans proxy_cookie_path.

location = /travaux {
    return 301 /travaux/;
}

location ^~ /travaux/ {
    # Le « / » final retire le préfixe /travaux avant de transmettre à l'application.
    proxy_pass http://127.0.0.1:8085/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # IP du visiteur (limitation des tentatives de connexion)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 2m;
    proxy_intercept_errors off;

    # Cookie d'administration limité au chemin de l'application.
    proxy_cookie_path / /travaux/;

    # L'application envoie ses propres en-têtes de sécurité (CSP, frame-ancestors…) :
    # ne pas ajouter ici de « X-Frame-Options », qui bloquerait l'intégration en iframe.

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
