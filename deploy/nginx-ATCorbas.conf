# Carte des arrêtés travaux de Corbas — à inclure dans le bloc « server { listen 443 … } »
# de maps.utagawavtt.com :
#     include /etc/nginx/snippets/ATCorbas.conf;
# puis : sudo nginx -t && sudo systemctl reload nginx
#
# Adapté à la configuration de maps.utagawavtt.com (Cloudflare, headers-more, cache tuiles) :
#  - « ^~ » : les locations regex du serveur (\.json$, \.geojson$, tuiles…) ne doivent pas
#    capter les URL de l'application ;
#  - aucun proxy_cache ici : l'API d'administration ne doit jamais être mise en cache ;
#  - more_set_headers local : coupe l'héritage des en-têtes CORS « * » du bloc server ;
#  - proxy_intercept_errors off : l'application renvoie ses propres erreurs JSON.

location = /ATCorbas {
    return 301 /ATCorbas/;
}

location ^~ /ATCorbas/ {
    # Le « / » final retire le préfixe /ATCorbas avant de transmettre à l'application.
    proxy_pass http://127.0.0.1:8085/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;              # IP réelle restaurée par le snippet Cloudflare
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 2m;

    proxy_intercept_errors off;

    # Le cookie d'administration est limité au préfixe.
    proxy_cookie_path / /ATCorbas/;

    # Remplace (et donc n'hérite pas) les en-têtes CORS du bloc server.
    more_set_headers "X-Content-Type-Options: nosniff";

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
