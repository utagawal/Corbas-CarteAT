# À inclure dans le bloc « server { … } » HTTPS de map.utagawavtt.com
# (ex. include /etc/nginx/snippets/ATCorbas.conf;), puis : nginx -t && systemctl reload nginx

location = /ATCorbas {
    return 301 /ATCorbas/;
}

location /ATCorbas/ {
    # Le « / » final retire le préfixe /ATCorbas avant de transmettre à l'application.
    proxy_pass http://127.0.0.1:8085/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;

    # Le cookie d'administration est limité au préfixe.
    proxy_cookie_path / /ATCorbas/;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
